# Workshop scenario: two periodic tasks running under Bao as a Zephyr guest.
#
# Disable PLIC: the cv32a6 SoC Kconfig.defconfig selects RISCV_HAS_PLIC
# but the baovm board uses APLIC + IMSIC (no PLIC DT node).
CONFIG_PLIC=n
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USERSPACE=y
CONFIG_PRIVILEGED_STACK_SIZE=4096
